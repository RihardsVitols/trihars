backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "videos"
    label: "Video Manager"
    files:
      - file: "videos.json"
        label: "Manage Videos"
        name: "videos_list"
        fields:
          - label: "Video Items"
            name: "videos"
            widget: "list"
            fields:
              - {label: "Video Title", name: "title", widget: "string"}
              - {label: "Embed URL (YouTube/Vimeo embed link)", name: "url", widget: "string"}
